    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Настройка marked для правильного рендеринга markdown
        marked.setOptions({

        // Вынесем ProfileSection наружу, чтобы избежать пересоздания при каждом рендере
        const ProfileSection = ({ title, items, color, field, isEditing, newItemInput, updateNewItemInput, addItemToProfileArray, removeItemFromProfileArray }) => (
            <div className="profile-section mb-4">
                <h3 className="text-xs font-medium text-gray-600 mb-1.5">{title}</h3>
                {isEditing ? (

                            ))}
                        </div>
                            <div className="flex gap-2">
                                <input
                                    key={`input-${field}`}
                                    type="text"
                                    value={newItemInput[field] || ''}
                                    onChange={(e) => updateNewItemInput(field, e.target.value)}
                                    onKeyPress={(e) => {
                                        if (e.key === 'Enter') {
                                            addItemToProfileArray(field);
                                        }
                                    }}
                                    placeholder="Добавить..."
                                    className="flex-1 px-3 py-1.5 text-sm border border-gray-300 rounded-md focus:outline-none focus:border-gray-900"

                                <span className="text-xs text-gray-400 italic">Пока нет данных</span>

        );

        const TERMS_CONTENT = `<h2>1. Общие положения</h2><p>Настоящее Пользовательское соглашение регулирует отношения между администрацией сервиса Chateon (далее — Сервис), расположенного по адресу chateon.ru, и пользователями Сервиса.</p><p>Сервис принадлежит и управляется Волковым Дмитрием Викторовичем (ИНН 463404496646), плательщиком налога на профессиональный доход (самозанятый), далее — «Исполнитель» или «Администрация».</p><p>Контактный email: <a href="mailto:support@linkeon.ru">support@linkeon.ru</a></p><p>Настоящее Соглашение является публичной офертой в соответствии со статьёй 437 Гражданского кодекса РФ. Использование Сервиса означает полное и безоговорочное принятие условий настоящего Соглашения.</p><h2>2. Описание Сервиса</h2><p>Chateon — это веб-сервис для взаимодействия с различными языковыми моделями искусственного интеллекта (AI). Сервис предоставляет следующие возможности:</p><ul><li>Диалоговое общение с AI-моделями (ChatGPT, Claude, Gemini, DeepSeek и другие)</li><li>Анализ загруженных файлов (PDF, изображения, текстовые документы)</li><li>Генерация изображений с помощью AI</li><li>Персонализация ответов на основе профиля пользователя</li><li>Выбор предпочтительной AI-модели</li></ul><p>Сервис выступает посредником между пользователем и AI-провайдерами. Ответы генерируются сторонними моделями, а не Исполнителем.</p><h2>3. Регистрация и аккаунт</h2><p>Для использования Сервиса необходимо пройти процедуру регистрации с указанием адреса электронной почты (email) и пароля. Вы обязуетесь предоставлять достоверный email-адрес.</p><p>Вы несёте ответственность за сохранность доступа к своему аккаунту и за все действия, совершённые с его использованием.</p><p>Один пользователь может иметь только один аккаунт.</p><h2>4. Правила использования</h2><p>Пользователям запрещается:</p><ul><li>Использовать Сервис для генерации незаконного, экстремистского, порнографического или иного запрещённого контента</li><li>Предпринимать попытки обхода ограничений AI-моделей                     /(^|\s)(сгенерируй|сгенерировать|генерируй).*(изображени|картинк|фото|рисун)/,

                    /\b(draw|paint|sketch)\b/i,

                ];
                return patterns.some(p => p.test(lower));

                const controller = new AbortController();

                    role: 'user',
                    content: messageText,
                    files: messageFiles
                };

                const currentModel = currentTab.model;
                const modelName = models.find(m => m.id === currentModel)?.name || '';

                let assistantMessageIndex;
                const realMessages = currentTab.messages.filter(m => m.role === 'user' || (m.role === 'assistant' && !m.isTyping));
                const isFirstMessage = realMessages.length === 0;
                const newChatName = isFirstMessage
                    ? (messageText || 'Файлы').slice(0, 30) + ((messageText || '').length > 30 ? '...' : '')
                    : null;

                setTabs(prevTabs => prevTabs.map(tab => {
                    if (tab.id === activeTabId) {
                        // Если из очереди — user message уже добавлено в sendMessage
                        const newMessages = [
                            ...(fromQueue ? tab.messages : [...tab.messages, userMessage]),
                            { role: 'assistant', content: '', model: currentModel, modelName: modelName, isTyping: true }
                        ];
                        assistantMessageIndex = newMessages.length - 1;

                        return {
                            ...tab,
                            messages: newMessages,
                            name: newChatName || tab.name,
                            isMessagesLoaded: true
                        };

                if (isFirstMessage && newChatName && user && user.email) {

                }

                try {
                    const hasFiles = messageFiles.length > 0 && messageFiles.some(f => f.file);

                    if (hasFiles) {
                        const fileObj = messageFiles[0];
                        const processedFile = await compressImage(fileObj.file);
                        const base64Data = await fileToBase64(processedFile);

                        const response = await fetch('https://nomira-ai-test.up.railway.app/webhook/analyze_file', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            signal: controller.signal,
                            body: JSON.stringify({
                                email: user.email,
                                chat_id: currentTab.chat_id,
                                model: modelName,
                                file_data: base64Data,
                                file_name: processedFile.name,
                                mime_type: processedFile.type || 'application/octet-stream',
                                question: messageText || 'Проанализируй этот файл и дай подробное описание его содержимого'
                            })
                        });

                        if (!response.ok) {
                            const errorText = await response.text();
                            throw new Error(errorText || 'Ошибка анализа файла');
                        }

                        const result = await response.json();

                        setTabs(prevTabs => prevTabs.map(t => {
                            if (t.id === activeTabId) {
                                const newMessages = [...t.messages];
                                let lastIndex = -1;
                                for (let i = newMessages.length - 1; i >= 0; i--) { if (newMessages[i].role === 'assistant') { lastIndex = i; break; } }
                                if (lastIndex === -1) return t;
                                newMessages[lastIndex] = {
                                    role: 'assistant',
                                    content: result.success ? result.analysis : `Ошибка: ${result.error || 'Неизвестная ошибка'}`,
                                    model: currentModel,
                                    modelName: modelName,
                                    isTyping: false
                                };
                                return { ...t, messages: newMessages };
                            }
                            return t;
                        }));

                    } else if (isImageGenerationRequest(messageText)) {
                        const response = await fetch('https://nomira-ai-test.up.railway.app/webhook/generate_image', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            signal: controller.signal,
                            body: JSON.stringify({
                                email: user.email,
                                chat_id: currentTab.chat_id,
                                prompt: messageText
                            })
                        });

                        if (!response.ok) {
                            const errorText = await response.text();
                            throw new Error(errorText || 'Ошибка генерации изображения');
                        }

                        const result = await response.json();

                        setTabs(prevTabs => prevTabs.map(t => {
                            if (t.id === activeTabId) {
                                const newMessages = [...t.messages];
                                let lastIndex = -1;
                                for (let i = newMessages.length - 1; i >= 0; i--) { if (newMessages[i].role === 'assistant') { lastIndex = i; break; } }
                                if (lastIndex === -1) return t;
                                newMessages[lastIndex] = {
                                    role: 'assistant',
                                    content: result.success ? result.analysis : `Ошибка: ${result.error || 'Неизвестная ошибка'}`,
                                    model: currentModel,
                                    modelName: modelName,
                                    isTyping: false
                                };
                                return { ...t, messages: newMessages };
                            }
                            return t;
                        }));

                    } else {
                    // Обычная отправка текста через /webhook/chat (streaming)
                    const response = await fetch('https://nomira-ai-test.up.railway.app/webhook/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        signal: controller.signal,
                        body: JSON.stringify({
                            email: user.email,
                            chat_id: currentTab.chat_id,
                            model: modelName,
                            message: messageText
                        })
                    });

                    if (!response.ok) {
                        let errorData;
                        try { errorData = await response.json(); } catch(e) {}
                        if (errorData && errorData.error === 'insufficient_balance') {
                            setTabs(prevTabs => prevTabs.map(t => {
                                if (t.id === activeTabId) {
                                    const newMessages = [...t.messages];
                                    let lastIndex = -1;
                                    for (let i = newMessages.length - 1; i >= 0; i--) { if (newMessages[i].role === 'assistant') { lastIndex = i; break; } }
                                    if (lastIndex !== -1) {
                                        newMessages[lastIndex] = { role: 'assistant', content: 'Недостаточно токенов для отправки сообщения. Пополните баланс.', model: currentModel, modelName: modelName, isTyping: false };
                                    }
                                    return { ...t, messages: newMessages };
                                }
                                return t;
                            }));
                            setShowTopupModal(true);
                            return;
                        }
                        throw new Error('Ошибка отправки сообщения');
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let accumulatedContent = '';

                    try {
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            const chunk = decoder.decode(value, { stream: true });
                            const lines = chunk.split('\n');

                            for (const line of lines) {
                                if (!line.trim()) continue;

                                try {
                                    const data = JSON.parse(line);

                                    if (data.type === 'item' && data.content) {
                                        accumulatedContent += data.content;

                                        setTabs(prevTabs => prevTabs.map(t => {
                                            if (t.id === activeTabId) {
                                                const newMessages = [...t.messages];
                                                let lastIndex = -1;
                                                for (let i = newMessages.length - 1; i >= 0; i--) { if (newMessages[i].role === 'assistant') { lastIndex = i; break; } }
                                                if (lastIndex === -1) return t;
                                                newMessages[lastIndex] = {
                                                    role: 'assistant',
                                                    content: accumulatedContent,
                                                    model: currentModel,
                                                    modelName: modelName,
                                                    isTyping: false
                                                };
                                                return { ...t, messages: newMessages };
                                            }
                                            return t;
                                        }));
                                    }
                                } catch (e) {
                                    // Игнорируем ошибки парсинга неполных JSON
                                }
                            }
                        }
                    } catch (readError) {
                        if (readError.name === 'AbortError') {
                            // Стриминг прерван пользователем — оставляем то что уже накопили
                            setTabs(prevTabs => prevTabs.map(t => {
                                if (t.id === activeTabId) {
                                    const newMessages = [...t.messages];
                                    let lastIndex = -1;
                                    for (let i = newMessages.length - 1; i >= 0; i--) { if (newMessages[i].role === 'assistant') { lastIndex = i; break; } }
                                    if (lastIndex !== -1 && newMessages[lastIndex].isTyping) {
                                        newMessages[lastIndex] = {
                                            ...newMessages[lastIndex],
                                            content: accumulatedContent || '(прервано)',
                                            isTyping: false
                                        };
                                    }
                                    return { ...t, messages: newMessages };
                                }
                                return t;
                            }));
                            return; // finally всё равно выполнится
                        }
                        throw readError;
                    }
                    } // конец else (обычный чат)

                    // Перезагрузка профиля после чата (fire-and-forget)
                    if (user && user.email) {
                        loadUserProfile(user.email);
                    }

                } catch (error) {
                    if (error.name === 'AbortError') {
                        // Запрос прерван — убираем isTyping у последнего ассистентского сообщения
                        setTabs(prevTabs => prevTabs.map(t => {
                            if (t.id === activeTabId) {
                                const newMessages = [...t.messages];
                                let lastIndex = -1;
                                for (let i = newMessages.length - 1; i >= 0; i--) { if (newMessages[i].role === 'assistant') { lastIndex = i; break; } }
                                if (lastIndex !== -1 && newMessages[lastIndex].isTyping) {
                                    newMessages[lastIndex] = {
                                        ...newMessages[lastIndex],
                                        content: '(прервано)',
                                        isTyping: false
                                    };
                                }
                                return { ...t, messages: newMessages };
                            }
                            return t;
                        }));
                        return;
                    }

                    console.error('Ошибка отправки сообщения:', error);

                    setTabs(prevTabs => prevTabs.map(t => {
                        if (t.id === activeTabId) {
                            const newMessages = [...t.messages];
                            let lastIndex = -1;
                            for (let i = newMessages.length - 1; i >= 0; i--) { if (newMessages[i].role === 'assistant') { lastIndex = i; break; } }
                            if (lastIndex === -1) return t;
                            newMessages[lastIndex] = {
                                role: 'assistant',
                                content: `Ошибка: ${error.message}. Попробуйте еще раз.`,
                                model: currentModel,
                                modelName: modelName,
                                isTyping: false
                            };
                            return { ...t, messages: newMessages };
                        }
                        return t;
                    }));
                } finally {
                    abortControllerRef.current = null;
                    setIsGenerating(false);
                    fetchBalance();
                    processQueue();
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {

            const handleInputChange = (e) => {

            const changeModel = (modelId) => {

                const numericModelId = parseInt(modelId, 10);

            const openSystemPrompt = async () => {

            const handleFileSelect = (e) => {
                const files = Array.from(e.target.files);
                const fileObjects = files.map(file => ({

            // Захват фото с камеры
            const handleCameraCapture = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                const file = files[0];
                const fileObj = {
                    name: file.name || `photo_${Date.now()}.jpg`,
                    size: file.size,
                    type: file.type || 'image/jpeg',
                    url: URL.createObjectURL(file),
                    file: file
                };
                setAttachedFiles(prev => [...prev, fileObj]);
                // Сброс input для повторного использования
                e.target.value = '';
            };

            // Сжатие изображения через canvas (макс 4 МБ base64)
            const compressImage = (file, maxSizeMB = 4) => {
                return new Promise((resolve, reject) => {
                    // Если не изображение — возвращаем как есть
                    if (!file.type.startsWith('image/')) {
                        resolve(file);
                        return;
                    }
                    // Если уже маленькое — не сжимаем
                    if (file.size <= maxSizeMB * 1024 * 1024 * 0.75) {
                        resolve(file);
                        return;
                    }

                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let { width, height } = img;

                        // Уменьшаем до макс 2048px по большей стороне
                        const maxDim = 2048;
                        if (width > maxDim || height > maxDim) {
                            const scale = maxDim / Math.max(width, height);
                            width = Math.round(width * scale);
                            height = Math.round(height * scale);
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // Сжимаем как JPEG с понижением качества
                        let quality = 0.85;
                        const tryCompress = () => {
                            canvas.toBlob((blob) => {
                                if (!blob) { reject(new Error('Ошибка сжатия')); return; }
                                if (blob.size <= maxSizeMB * 1024 * 1024 * 0.75 || quality <= 0.3) {
                                    const compressed = new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' });
                                    resolve(compressed);
                                } else {
                                    quality -= 0.15;
                                    tryCompress();
                                }
                            }, 'image/jpeg', quality);
                        };
                        tryCompress();
                    };
                    img.onerror = () => reject(new Error('Не удалось загрузить изображение'));
                    img.src = URL.createObjectURL(file);
                });
            };

            // Конвертация File в base64
            const fileToBase64 = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => {
                        // Убираем prefix "data:...;base64,"
                        const base64 = reader.result.split(',')[1];
                        resolve(base64);
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            };

            const removeFile = (index) => {
                setAttachedFiles(prev => prev.filter((_, i) => i !== index));
            };

            const startEditingProfile = () => {
                setEditedProfile(JSON.parse(JSON.stringify(userProfile)));

                    ...prev,
                    [field]: value

                    setNewItemInput(prev => ({ ...prev, [field]: '' }));
                }

            const updateNewItemInput = (field, value) => {
                setNewItemInput(prev => ({ ...prev, [field]: value }));

            const toggleRecording = () => {
                if (isRecording) {
                    recognitionRef.current?.stop();
                    setIsRecording(false);
                } else {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (!SpeechRecognition) {
                        alert('Браузер не поддерживает распознавание речи');
                        return;
                    }
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'ru-RU';
                    recognition.interimResults = false;
                    recognition.continuous = true;

                    recognition.onresult = (event) => {
                        let transcript = '';
                        for (let i = event.resultIndex; i < event.results.length; i++) {
                            if (event.results[i].isFinal) {
                                transcript += event.results[i][0].transcript;
                            }
                        }
                        if (transcript) {
                            setInput(prev => prev ? prev + ' ' + transcript : transcript);
                        }
                    };

                    recognition.onerror = (event) => {
                        console.error('Speech recognition error:', event.error);
                        setIsRecording(false);
                    };

                    recognition.onend = () => {
                        setIsRecording(false);
                    };

                    recognition.start();
                    recognitionRef.current = recognition;
                    setIsRecording(true);
                }
            };

            // Экран загрузки
            const loadingMessages = ['Загружаем Chateon...', 'Ещё чуть-чуть...', 'Почти всё готово...', 'Благодарим за ожидание...', 'Уже скоро!'];

                        </div>
                    )}

                    {/* Модальное окно системного промпта */}
                    {isSystemPromptOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[70] p-4">
                            <div className="bg-white rounded-lg shadow-xl max-w-lg w-full p-6 animate-fadeIn">
                                <h3 className="text-lg font-semibold text-gray-800 mb-1">
                                    Системный промпт
                                </h3>
                                <p className="text-xs text-gray-500 mb-4">
                                    Инструкции для AI в этом чате. Применяются к каждому сообщению.
                                </p>
                                <textarea
                                    value={systemPromptText}
                                    onChange={(e) => setSystemPromptText(e.target.value)}
                                    placeholder="Например: Отвечай кратко и по делу. Используй примеры кода на Python."
                                    className="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm text-gray-800 placeholder-gray-400 focus:border-gray-400 focus:outline-none resize-y"
                                    rows="6"
                                    style={{ minHeight: '120px', maxHeight: '400px' }}
                                />
                                <div className="flex space-x-3 mt-4">
                                    <button
                                        onClick={() => setIsSystemPromptOpen(false)}
                                        disabled={isSavingSystemPrompt}
                                        className="flex-1 px-4 py-2.5 bg-gray-100 text-gray-700 rounded-lg font-medium hover:bg-gray-200 active:bg-gray-300 transition-colors disabled:opacity-50"
                                    >
                                        Отмена
                                    </button>
                                    <button
                                        onClick={saveSystemPrompt}
                                        disabled={isSavingSystemPrompt}
                                        className="flex-1 px-4 py-2.5 bg-gray-800 text-white rounded-lg font-medium hover:bg-gray-900 active:bg-black transition-colors disabled:opacity-50 flex items-center justify-center"
                                    >
                                        {isSavingSystemPrompt ? (
                                            <>
                                                <div className="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin mr-2"></div>
                                                Сохранение...
                                            </>
                                        ) : (
                                            'Сохранить'
                                        )}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Модалка пополнения баланса */}
                    {showTopupModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[70] p-4">
                            <div className="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 animate-fadeIn">
                                <div className="flex items-center justify-between mb-2">
                                    <h3 className="text-lg font-semibold text-gray-800">Пополнить баланс</h3>
                                    <button onClick={() => setShowTopupModal(false)} className="text-gray-400 hover:text-gray-600 transition-colors">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                                    </button>
                                </div>
                                <p className="text-sm text-gray-500 mb-5">
                                    Текущий баланс: <span className="font-semibold text-gray-700">{tokenBalance.toLocaleString()}</span> токенов
                                </p>
                                <div className="grid grid-cols-3 gap-3 mb-5">
                                    {[
                                        { id: 1, name: 'Starter', price: '199', tokens: '50 000', badge: null },
                                        { id: 2, name: 'Standard', price: '499', tokens: '200 000', badge: 'Популярный' },
                                        { id: 3, name: 'Premium', price: '1 999', tokens: '1 000 000', badge: null }
                                    ].map(tariff => (
                                        <button
                                            key={tariff.id}
                                            onClick={() => handleTopup(tariff.id)}
                                            disabled={isTopupLoading}
                                            className={`relative flex flex-col items-center p-4 rounded-xl border-2 transition-all hover:shadow-md active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed ${
                                                tariff.id === 2 ? 'border-indigo-500 bg-indigo-50' : 'border-gray-200 hover:border-gray-300'
                                            }`}
                                        >
                                            {tariff.badge && (
                                                <span className="absolute -top-2.5 left-1/2 -translate-x-1/2 bg-indigo-500 text-white text-[10px] font-semibold px-2 py-0.5 rounded-full whitespace-nowrap">
                                                    {tariff.badge}
                                                </span>
                                            )}
                                            <span className="text-xs font-medium text-gray-500 mb-1">{tariff.name}</span>
                                            <span className="text-xl font-bold text-gray-800">{tariff.price} ₽</span>
                                            <span className="text-xs text-gray-500 mt-1">{tariff.tokens} токенов</span>
                                        </button>
                                    ))}
                                </div>
                                <p className="text-[11px] text-gray-400 text-center">
                                    Тестовый режим: оплата не списывается
                                </p>
                            </div>
                        </div>
                    )}

                    {/* Модалка юридических документов */}
                    {legalModal.isOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[80] p-4" onClick={() => setLegalModal({ isOpen: false, type: null })}>
                            <div className="bg-white rounded-xl shadow-xl max-w-2xl w-full max-h-[85vh] flex flex-col animate-fadeIn" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between p-5 border-b border-gray-200 flex-shrink-0">
                                    <h3 className="text-lg font-semibold text-gray-800">
                                        {legalModal.type === 'terms' ? 'Пользовательское соглашение' : 'Политика конфиденциальности'}
                                    </h3>
                                    <button onClick={() => setLegalModal({ isOpen: false, type: null })} className="text-gray-400 hover:text-gray-600 transition-colors">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                                    </button>
                                </div>
                                <div className="overflow-y-auto p-5 legal-content" dangerouslySetInnerHTML={{ __html: legalModal.type === 'terms' ? TERMS_CONTENT : PRIVACY_CONTENT }} />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
